<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>💀</title>

  <style>
    :root {
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #ffffff;
      --text-sub: #d0d0d0;
      --accent: #7289da;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text-main);
      background-image: url("https://raw.githubusercontent.com/HenryNetworkk/henrynetworkk.github.io/anhminhnhua/bg.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 0;
    }

    .profile-container {
      position: relative;
      z-index: 1;
      width: fit-content;
      max-width: calc(100vw - 40px);
      min-width: 320px;
      padding: 3.5px 8.67px;
      border-radius: 24px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .profile-img {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid rgba(255, 255, 255, 0.15);
      margin-top: 0.05px;
      margin-bottom: 0px;
      transition: 0.3s;
    }

    .profile-img:hover {
      border-color: var(--accent);
      transform: scale(1.0167);
    }

    .profile-name {
      font-size: 20.67px;
      font-weight: bold;
      margin-top: 0px;
      margin-bottom: 19.67px;
    }

    .profile-info {
      color: var(--text-sub);
      margin-bottom: 12px;
    }

    .social-links {
      display: flex;
      flex-wrap: nowrap;
      justify-content: center;
      align-items: center;
      gap: 9.67px;
      margin-top: 0px;
      padding-bottom: 2.67px;
      width: max-content;
      margin-left: auto;
      margin-right: auto;
    }

    .social-links::-webkit-scrollbar {
      height: 9px;
    }

    .social-links::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .social-links a {
      flex: 0 0 auto;
      text-decoration: none;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 8px; 
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: 0.3s;
    }

    .social-links a:hover {
      transform: translateY(-2px);
      background: rgba(114, 137, 218, 0.22);
    }

    iconify-icon {
      color: #fff;
      font-size: 35.967px;
      width: 01em;
      height: 1em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
</head>

<body>
  <div class="profile-container">
    <img src="https://avatars.githubusercontent.com/u/2894976?v=4" class="profile-img" alt="Profile avatar">

    <h2 class="profile-name">𝗛𝗲𝗻𝗿𝘆𝗡𝗲𝘁𝘄𝗼𝗿𝗸 | 𝟭𝟬𝟬万请求</h2>

    <div class="social-links">
      <a href="https://discord.com/users/208150597508136961" target="_blank" rel="noopener noreferrer">
        <iconify-icon icon="simple-icons:discord"></iconify-icon>
      </a>
      <a href="https://github.com/HenryNetworkk" target="_blank" rel="noopener noreferrer">
        <iconify-icon icon="simple-icons:github"></iconify-icon>
      </a>
      <a href="https://t.me/kingvon008" target="_blank" rel="noopener noreferrer">
        <iconify-icon icon="simple-icons:telegram"></iconify-icon>
      </a>
      <a href="https://www.tiktok.com/@champagnehaki" target="_blank" rel="noopener noreferrer">
        <iconify-icon icon="simple-icons:tiktok"></iconify-icon>
      </a>
      <a href="https://leetcode.com/u/HenryNetworkk/" target="_blank" rel="noopener noreferrer">
        <iconify-icon icon="simple-icons:leetcode"></iconify-icon>
      </a>
      <a href="https://tryhackme.com/p/HenryNetWork" target="_blank" rel="noopener noreferrer">
        <iconify-icon icon="simple-icons:tryhackme"></iconify-icon>
      </a>
      <a href="https://profile.hackthebox.com/profile/019d398f-e678-7229-9468-a992214c5177" target="_blank" rel="noopener noreferrer">
        <iconify-icon icon="simple-icons:hackthebox"></iconify-icon>
      </a>
    </div>
  </div>

  <script>
    window.addEventListener("scroll", () => {
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
